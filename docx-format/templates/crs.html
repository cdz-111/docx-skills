<!DOCTYPE html>
<!--
  crs.html —— 改动事项单（CRS）可勾选页模板
  ------------------------------------------------------------------
  用法：复制本文件为 <文档名>_改动事项.html，只替换 <script id="crs-data">
  里的 JSON 内容（结构见 skills/docx-format/references/change-request-sheet.md §2 §3）。
  结构与 class / id 是 crs_apply 与解析脚本依赖的契约，不要改。

  交互：逐条勾选、全选/清空、按档勾选、按来源与风险筛选、关键词搜索、
        建议可原地编辑（自动记为 modified）、导出 approved.json。
  主题：跟随系统深浅色，两套都可读。零外部依赖。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>改动事项单</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f6f7f9; --bg3:#eceef2;
  --fg:#1b1d21; --fg2:#5c6169; --fg3:#8b9098;
  --line:#dcdfe4; --line2:#c3c8d0;
  --accent:#185fa5; --accent-fg:#ffffff;
  --s:#a32d2d; --s-bg:#fcebeb;
  --a:#854f0b; --a-bg:#faeeda;
  --b:#185fa5; --b-bg:#e6f1fb;
  --c:#5f5e5a; --c-bg:#f1efe8;
  --ok:#3b6d11; --ok-bg:#eaf3de;
  --warn:#854f0b; --warn-bg:#faeeda;
  --hit:#e6f1fb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1d20; --bg2:#24262a; --bg3:#2e3136;
    --fg:#eceef2; --fg2:#b3b8c0; --fg3:#83888f;
    --line:#3a3e44; --line2:#4c5158;
    --accent:#85b7eb; --accent-fg:#12161c;
    --s:#f09595; --s-bg:#4a1b0c;
    --a:#ef9f27; --a-bg:#412402;
    --b:#85b7eb; --b-bg:#042c53;
    --c:#b4b2a9; --c-bg:#2c2c2a;
    --ok:#97c459; --ok-bg:#173404;
    --warn:#ef9f27; --warn-bg:#412402;
    --hit:#3c3489;
  }
}
*{box-sizing:border-box}
body{
  margin:0; padding:24px 20px 80px;
  background:var(--bg); color:var(--fg);
  font:400 13px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
}
.wrap{max-width:1360px;margin:0 auto}
h1{font-size:17px;font-weight:500;margin:0 0 4px}
.meta{color:var(--fg2);font-size:12px;line-height:1.8;word-break:break-all}
.meta code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:11px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
button{
  font:inherit;font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer;
  background:var(--bg2);color:var(--fg);border:1px solid var(--line2);
}
button:hover{background:var(--bg3)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
button.primary:hover{opacity:.9}
button.g-S{border-color:var(--s);color:var(--s)}
button.g-A{border-color:var(--a);color:var(--a)}
button.g-B{border-color:var(--b);color:var(--b)}
button.g-C{border-color:var(--c);color:var(--c)}
input[type=search],select{
  font:inherit;font-size:12px;padding:5px 9px;border-radius:6px;
  background:var(--bg2);color:var(--fg);border:1px solid var(--line2);
}
input[type=search]{width:200px}
.stat{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:7px 13px;min-width:96px;
}
.chip .n{font-size:19px;font-weight:500;line-height:1.2}
.chip .k{font-size:11px;color:var(--fg3)}
.gate{
  display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;
  border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);
}
.gate.approved{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
thead th{
  position:sticky;top:0;background:var(--bg2);text-align:left;font-weight:500;
  padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;z-index:2;
}
tbody tr{border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--bg2)}
tbody tr.done{opacity:.62}
td{padding:9px 10px}
td.c{width:36px;text-align:center}
td.id{font-family:ui-monospace,Consolas,monospace;white-space:nowrap;font-size:12px}
td.grade{white-space:nowrap;font-weight:500}
td.risk{white-space:nowrap;font-size:11.5px;color:var(--fg2)}
td.after{min-width:210px}
td.before{color:var(--fg2)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:500}
.tag.S{color:var(--s);background:var(--s-bg)}
.tag.A{color:var(--a);background:var(--a-bg)}
.tag.B{color:var(--b);background:var(--b-bg)}
.tag.C{color:var(--c);background:var(--c-bg)}
.tag.mod{color:var(--warn);background:var(--warn-bg);margin-left:6px}
.grow{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--fg3)}
tbody tr.grouphead td{
  background:var(--bg3);font-weight:500;font-size:12px;padding:6px 10px;
  color:var(--fg2);border-bottom:1px solid var(--line);
}
.editable{outline:none;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.editable:focus{background:var(--hit);box-shadow:0 0 0 2px var(--accent)}
mark{background:var(--hit);color:inherit;border-radius:2px}
.hide{display:none !important}
footer{
  margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--fg3);font-size:11.5px;line-height:1.9;
}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--accent);color:var(--accent-fg);padding:9px 18px;border-radius:8px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s;
}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <h1 id="h-title">改动事项单</h1>
  <div class="meta" id="h-meta"></div>
  <div style="margin-top:8px"><span class="gate" id="h-gate">待批准</span></div>

  <div class="stat" id="h-stat"></div>

  <div class="bar">
    <button id="b-all">全选</button>
    <button id="b-none">清空</button>
    <span class="sep"></span>
    <button class="g-S" data-grade="S">只勾 S 必改</button>
    <button class="g-A" data-grade="A">只勾 A 应改</button>
    <button class="g-B" data-grade="B">只勾 B 建议</button>
    <span class="sep"></span>
    <select id="f-source">
      <option value="">全部来源</option>
    </select>
    <select id="f-risk">
      <option value="">全部风险</option>
      <option value="low">低</option>
      <option value="mid">中</option>
      <option value="high">高</option>
    </select>
    <input type="search" id="f-kw" placeholder="搜索 ID / 位置 / 文字…">
    <span class="sep"></span>
    <button class="primary" id="b-export">导出已批准 approved.json</button>
  </div>

  <table>
    <thead>
      <tr>
        <th class="c"></th>
        <th>ID</th><th>档</th><th>位置</th>
        <th>现状</th><th>建议改为</th><th>依据</th>
        <th>风险</th><th>影响面</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>

  <footer>
    <div>勾选后点「导出已批准」→ 得到 <code>_approved.json</code>，交给执行侧；未勾选项不会被改动。</div>
    <div>「建议改为」可以原地点开编辑：改过的条目会标记为已修改，导出时带上你的写法。</div>
    <div>本页只是 <code>.json</code> 的视图；两者不一致时以 <code>.json</code> 为准。</div>
  </footer>
</div>
<div id="toast"></div>

<script id="crs-data" type="application/json">
{
  "crs_version": "1.0",
  "target": {
    "path": "（示例）C:\\path\\to\\文档.docx",
    "md5": "00000000000000000000000000000000",
    "document_xml_md5": "00000000000000000000000000000000",
    "paragraphs": 0,
    "captured_at": "1970-01-01T00:00:00+08:00"
  },
  "baseline": { "note": "示例数据，生成实例时替换本 script 的全部内容", "previous_round": "" },
  "sources": ["lint"],
  "gate": { "state": "awaiting_approval", "total": 2, "approved": 0, "rejected": 0 },
  "items": [
    {
      "id": "CR-001", "grade": "S", "source": "lint", "category": "错字",
      "where": { "section": "2.4.1", "para": 1034, "anchor": "无b符号比特量化", "count": 1 },
      "before": "对于无b符号比特量化",
      "after": "对于无符号 b 比特量化",
      "basis": "示例：b 是公式对象，原文插错位置且多一个「范」字",
      "risk": "low", "impact": "无",
      "executor": "text_replace", "decision": "pending", "after_override": null, "notes": ""
    },
    {
      "id": "CR-002", "grade": "B", "source": "lint", "category": "体例",
      "where": { "section": "全文", "para": 0, "anchor": "图 N所示", "count": 68 },
      "before": "图 19所示",
      "after": "图 19 所示",
      "basis": "示例：体例统一（有空格写法 9 处）",
      "risk": "low", "impact": "无",
      "executor": "text_replace", "decision": "pending", "after_override": null, "notes": ""
    }
  ]
}
</script>

<script>
(function(){
  "use strict";
  var GRADE_ORDER = ["S","A","B","C"];
  var GRADE_NAME  = {S:"S 必改", A:"A 应改", B:"B 建议", C:"C 待核"};
  var RISK_NAME   = {low:"低", mid:"中", high:"高"};
  var SOURCE_NAME = {propose:"排版/层级", "numbering-xref":"编号/引用", lint:"文字校对"};

  var crs = JSON.parse(document.getElementById("crs-data").textContent);
  var items = crs.items || [];
  var edited = {};   // id -> 用户改写的建议

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (kids || []).forEach(function(c){ e.appendChild(c); });
    return e;
  }
  function txt(s){ return document.createTextNode(String(s == null ? "" : s)); }

  // ---------- 头部 ----------
  var t = crs.target || {};
  document.title = "改动事项单 —— " + String(t.path || "").split(/[\\\/]/).pop();
  document.getElementById("h-title").textContent =
    "改动事项单 · " + String(t.path || "（未指定文档）").split(/[\\\/]/).pop();
  var meta = document.getElementById("h-meta");
  meta.innerHTML =
    "目标：<code>" + esc(t.path) + "</code><br>" +
    "指纹：md5 <code>" + esc(t.md5) + "</code>　document.xml <code>" +
      esc(t.document_xml_md5) + "</code>　段落 <code>" + esc(t.paragraphs) + "</code><br>" +
    "出单时间：" + esc(t.captured_at) +
    ((crs.baseline && crs.baseline.previous_round)
      ? "　上一轮：" + esc(crs.baseline.previous_round) : "");

  // ---------- 表格 ----------
  var tb = document.getElementById("tb");
  function render(){
    tb.innerHTML = "";
    var shown = items.filter(matchFilter);
    if (!shown.length){
      var tr = el("tr", {}, [el("td", {colspan:"9"})]);
      tr.firstChild.appendChild(txt("没有符合条件的条目。"));
      tb.appendChild(tr);
      return;
    }
    GRADE_ORDER.forEach(function(g){
      var group = shown.filter(function(it){ return it.grade === g; });
      if (!group.length) return;
      var gh = el("tr", {class:"grouphead"}, [el("td", {colspan:"9"})]);
      gh.firstChild.appendChild(txt(GRADE_NAME[g] + "　" + group.length + " 项"));
      tb.appendChild(gh);
      var tbody = el("tbody", {"data-grade-group": g});
      group.forEach(function(it){ tbody.appendChild(row(it)); });
      tb.appendChild(tbody);
    });
  }

  function matchFilter(it){
    var fs = document.getElementById("f-source").value;
    var fr = document.getElementById("f-risk").value;
    var kw = document.getElementById("f-kw").value.trim().toLowerCase();
    if (fs && it.source !== fs) return false;
    if (fr && it.risk !== fr) return false;
    if (kw){
      var hay = [it.id, it.grade, it.category, it.before, it.after, it.basis,
                 it.impact, (it.where && it.where.section) || "",
                 (it.where && it.where.anchor) || ""].join(" ").toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  }

  function row(it){
    var tr = el("tr", {
      class:"cr-row", "data-cr-id": it.id, "data-grade": it.grade || "",
      "data-risk": it.risk || "", "data-source": it.source || "",
      "data-decision": it.decision || "pending"
    });

    var tdC = el("td", {class:"c"});
    var cb = el("input", {type:"checkbox", class:"cr-check",
                          id:"cb-" + it.id, "data-cr-id": it.id});
    cb.checked = (it.decision === "approved" || it.decision === "modified");
    if (it.decision === "closed") cb.disabled = true;
    cb.addEventListener("change", function(){ onCheck(it, cb.checked); });
    tdC.appendChild(cb);
    tr.appendChild(tdC);

    var tdId = el("td", {class:"id"});
    var lab = el("label", {for:"cb-" + it.id});
    lab.appendChild(txt(it.id));
    tdId.appendChild(lab);
    if (it.decision === "closed"){
      var closed = el("span", {class:"tag mod"});
      closed.appendChild(txt("已闭合"));
      tdId.appendChild(closed);
    }
    if (edited[it.id] !== undefined){
      var m = el("span", {class:"tag mod", "data-flag":"modified"});
      m.appendChild(txt("已改建议"));
      tdId.appendChild(m);
    }
    tr.appendChild(tdId);

    var tdG = el("td", {class:"grade"});
    var tg = el("span", {class:"tag " + (it.grade || "C")});
    tg.appendChild(txt(it.grade || "-"));
    tdG.appendChild(tg);
    tr.appendChild(tdG);

    var w = it.where || {};
    tr.appendChild(cellTxt([w.section, (w.para ? "段 " + w.para : ""),
                            (w.anchor ? w.anchor : ""),
                            (w.count > 1 ? "共 " + w.count + " 处" : "")]
                            .filter(Boolean).join(" · ")));
    tr.appendChild(cellTxt(it.before, "before"));
    tr.appendChild(cellAfter(it));
    tr.appendChild(cellTxt(it.basis));
    tr.appendChild(cellTxt(RISK_NAME[it.risk] || it.risk || "", "risk"));
    tr.appendChild(cellTxt(it.impact));
    return tr;
  }

  function cellTxt(s, cls){
    var td = el("td", cls ? {class:cls} : {});
    td.appendChild(txt(s == null ? "" : s));
    return td;
  }

  function cellAfter(it){
    var td = el("td", {class:"after"});
    var div = el("div", {class:"editable", contenteditable:"true",
                         "data-cr-id": it.id, role:"textbox",
                         "aria-label":"建议改为 " + it.id,
                         spellcheck:"false"});
    div.appendChild(txt(edited[it.id] !== undefined ? edited[it.id] : (it.after || "")));
    div.addEventListener("blur", function(){
      var v = div.textContent.trim();
      if (v !== (it.after || "")){
        edited[it.id] = v;
      } else {
        delete edited[it.id];
      }
      render();
    });
    td.appendChild(div);
    return td;
  }

  // ---------- 状态 ----------
  function dec(it){
    if (it.decision === "closed") return "closed";
    if (edited[it.id] !== undefined) return "modified";
    var cb = document.getElementById("cb-" + it.id);
    return cb && cb.checked ? "approved" : "rejected";
  }

  function onCheck(it, on){
    it.decision = on ? "approved" : "pending";
    var tr = document.querySelector('tr.cr-row[data-cr-id="' + it.id + '"]');
    if (tr) tr.setAttribute("data-decision", dec(it));
    if (tr) tr.classList.toggle("done", !on);
    summary();
  }

  function setAll(ids, on){
    ids.forEach(function(it){
      if (it.decision === "closed") return;
      var cb = document.getElementById("cb-" + it.id);
      if (!cb) return;
      cb.checked = on;
      it.decision = on ? "approved" : "pending";
    });
    render(); summary();
  }

  function summary(){
    var total = items.length;
    var chosen = items.filter(function(it){
      return dec(it) === "approved" || dec(it) === "modified";
    }).length;
    var by = {};
    GRADE_ORDER.forEach(function(g){
      by[g] = items.filter(function(it){
        return it.grade === g &&
          (dec(it) === "approved" || dec(it) === "modified");
      }).length;
    });
    var s = document.getElementById("h-stat");
    s.innerHTML = "";
    function chip(n, k, color){
      var d = el("div", {class:"chip"});
      var a = el("div", {class:"n"}); a.appendChild(txt(n));
      if (color) a.style.color = color;
      var b = el("div", {class:"k"}); b.appendChild(txt(k));
      d.appendChild(a); d.appendChild(b); s.appendChild(d);
    }
    chip(chosen + " / " + total, "已勾选 / 总数", chosen ? null : "");
    GRADE_ORDER.forEach(function(g){
      chip(by[g], GRADE_NAME[g]);
    });
    chip(items.filter(function(it){ return it.risk === "high"; }).length,
         "高风险项");
    var g = document.getElementById("h-gate");
    var st = chosen > 0 ? "approved" : "awaiting_approval";
    g.textContent = chosen > 0 ? ("已勾选 " + chosen + " 项 · 待确认") : "待批准";
    g.className = "gate" + (chosen > 0 ? " approved" : "");
    return st;
  }

  // ---------- 导出 ----------
  function exportObj(){
    var out = {crs_version: crs.crs_version || "1.0",
               target_md5: (crs.target || {}).md5 || "",
               exported_at: new Date().toISOString(), items: []};
    items.forEach(function(it){
      var d = dec(it);
      if (d === "pending") return;          // 未表态的一律不出现
      if (d === "closed")  return;
      var e = {id: it.id, decision: d};
      if (d === "modified") e.after_override = edited[it.id];
      out.items.push(e);
    });
    return out;
  }

  document.getElementById("b-export").addEventListener("click", function(){
    var obj = exportObj();
    if (!obj.items.length){ toast("还没勾任何一项"); return; }
    var s = JSON.stringify(obj, null, 2);
    var name = String((crs.target || {}).path || "文档")
      .split(/[\\\/]/).pop().replace(/\.docx?$/i, "") + "_approved.json";
    try {
      var blob = new Blob([s], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = el("a", {href:url, download:name});
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    } catch (e) { /* 有些预览环境不给下载，走剪贴板与提示 */ }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(
        function(){ toast("已导出 " + obj.items.length + " 项，JSON 也已复制到剪贴板"); },
        function(){ toast("已导出 " + obj.items.length + " 项；请把 " + name + " 交给执行侧"); }
      );
    } else {
      toast("已导出 " + obj.items.length + " 项；请把 " + name + " 交给执行侧");
    }
  });

  var toastTimer;
  function toast(msg){
    var t2 = document.getElementById("toast");
    t2.textContent = msg;
    t2.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t2.classList.remove("on"); }, 2600);
  }

  // ---------- 工具条 ----------
  var srcSel = document.getElementById("f-source");
  (crs.sources || []).forEach(function(s){
    var o = el("option", {value:s});
    o.appendChild(txt(SOURCE_NAME[s] || s));
    srcSel.appendChild(o);
  });
  ["f-source","f-risk"].forEach(function(id){
    document.getElementById(id).addEventListener("change", render);
  });
  var kwTimer;
  document.getElementById("f-kw").addEventListener("input", function(){
    clearTimeout(kwTimer);
    kwTimer = setTimeout(render, 120);
  });

  document.getElementById("b-all").addEventListener("click", function(){
    setAll(items.filter(matchFilter), true);
  });
  document.getElementById("b-none").addEventListener("click", function(){
    setAll(items.filter(matchFilter), false);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-grade]"),
    function(btn){
      if (btn.tagName !== "BUTTON") return;
      btn.addEventListener("click", function(){
        var g = btn.getAttribute("data-grade");
        setAll(items, false);
        setAll(items.filter(function(it){ return it.grade === g; }), true);
        toast("已只勾选 " + GRADE_NAME[g]);
      });
    });

  render();
  summary();
})();
</script>
</body>
</html>
